# The settings an agent starts with when Brave Search is added to it.
# 'bountiful add brave ID' copies them into the "tools" section of the
# agent's agent.json, where they can be changed. The API key is asked
# for when the group is added and kept in the system keyring, never in
# agent.json. Brave's Search plan charges per search after a monthly
# free credit, so every search the agent makes counts against it.

# The most text one search returns, in tokens, from 1024 to 32768.
# Everything a search returns stays in the conversation until the
# turn ends, costing time and memory.
max_tokens = 2048

# The country whose results to favor, as a two-letter code such as
# "us" or "pl". Empty lets Brave decide.
country = ""

# The language of the results, such as "en" or "pl". Empty lets Brave
# decide.
search_lang = ""

# Filtering of adult content: "off", "moderate", or "strict".
safesearch = "moderate"
